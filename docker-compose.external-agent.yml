# Use with docker-compose.yml and choose one service, e.g. production.
x-external-agent-environment: &external-agent-environment
  PRESENTON_EXTERNAL_AGENT: "true"
  DISABLE_AUTH: "false"
  MEM0_ENABLED: "false"
  START_OLLAMA: "false"
  DISABLE_IMAGE_GENERATION: "true"
  CAN_CHANGE_KEYS: "false"

x-external-agent-build: &external-agent-build
  args:
    PRESENTON_EXTERNAL_AGENT: "true"
    INSTALL_EXTENDED_FONTS: "false"
    PRESENTON_HOST_ASSET_PREFIX: "/api/presentation-editor-assets"
    NEXT_PUBLIC_HOST_ASSET_PREFIX: "/api/presentation-editor-assets"

services:
  production:
    init: true
    build: *external-agent-build
    environment: *external-agent-environment
  production-gpu:
    init: true
    build: *external-agent-build
    environment: *external-agent-environment
  development:
    init: true
    build: *external-agent-build
    environment: *external-agent-environment
  development-gpu:
    init: true
    build: *external-agent-build
    environment: *external-agent-environment
